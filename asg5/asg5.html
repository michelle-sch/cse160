<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scottish Coast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: Georgia, serif; }
    canvas { display: block; }
    #info {
      position: fixed; top: 16px; left: 16px; color: #c8d8e8;
      background: rgba(10,15,25,0.75); border: 1px solid rgba(100,140,180,0.3);
      padding: 12px 18px; border-radius: 6px; font-size: 13px; line-height: 1.9;
      pointer-events: none; z-index: 10;
    }
    #info h2 { font-size: 14px; margin-bottom: 6px; color: #8ab4d4; letter-spacing: 2px; text-transform: uppercase; }
    #wow {
      position: fixed; bottom: 70px; right: 16px;
      background: rgba(10,15,25,0.75); color: #8ab4d4;
      border: 1px solid rgba(100,140,180,0.3); padding: 8px 16px;
      border-radius: 4px; font-size: 11px; letter-spacing: 1px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>Coast Scene </h2>
    Left, Right drag — Pan <br>
    Scroll — Zoom
  </div>
  <div id="wow">Wow features: Animated waves, bioluminescent glow, day/night toggle </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    //  ORBIT CONTROLS 
    THREE.OrbitControls = function (cam, el) {
      var scope = this;
      scope.camera = cam; scope.domElement = el;
      scope.target = new THREE.Vector3();
      scope.minDistance = 1; scope.maxDistance = 500;
      var STATE = { NONE:-1, ROTATE:0, PAN:1 };
      var state = STATE.NONE;
      var sph = new THREE.Spherical(); var sphDelta = {theta:0,phi:0};
      var scale = 1; var panOff = new THREE.Vector3();
      var rStart = new THREE.Vector2(); var rEnd = new THREE.Vector2(); var rDelta = new THREE.Vector2();
      var pStart = new THREE.Vector2(); var pEnd = new THREE.Vector2(); var pDelta = new THREE.Vector2();
      var plv = new THREE.Vector3(); var puv = new THREE.Vector3(); var off = new THREE.Vector3();
      var quat = new THREE.Quaternion().setFromUnitVectors(cam.up, new THREE.Vector3(0,1,0));
      var quatI = quat.clone();
      if (typeof quatI.invert === 'function') quatI.invert();
      else if (typeof quatI.inverse === 'function') quatI.inverse();
      function panLeft(d,m){plv.setFromMatrixColumn(m,0);plv.multiplyScalar(-d);panOff.add(plv);}
      function panUp(d,m){puv.setFromMatrixColumn(m,1);puv.multiplyScalar(d);panOff.add(puv);}
      function doPan(dx,dy){var h=el.clientHeight||600;var dist=cam.position.distanceTo(scope.target);panLeft(2*dx*dist/h,cam.matrix);panUp(2*dy*dist/h,cam.matrix);}
      scope.update = function(){
        off.copy(cam.position).sub(scope.target); off.applyQuaternion(quat);
        sph.setFromVector3(off);
        sph.theta+=sphDelta.theta; sph.phi+=sphDelta.phi;
        sph.phi=Math.max(0.001,Math.min(Math.PI-0.001,sph.phi));
        sph.radius=Math.max(scope.minDistance,Math.min(scope.maxDistance,sph.radius*scale));
        scope.target.add(panOff);
        off.setFromSpherical(sph); off.applyQuaternion(quatI);
        cam.position.copy(scope.target).add(off); cam.lookAt(scope.target);
        sphDelta.theta=0; sphDelta.phi=0; scale=1; panOff.set(0,0,0);
      };
      function onMove(e){
        if(state===STATE.ROTATE){rEnd.set(e.clientX,e.clientY);rDelta.subVectors(rEnd,rStart);var h=el.clientHeight||600;sphDelta.theta-=2*Math.PI*rDelta.x/h;sphDelta.phi-=2*Math.PI*rDelta.y/h;rStart.copy(rEnd);scope.update();}
        else if(state===STATE.PAN){pEnd.set(e.clientX,e.clientY);pDelta.subVectors(pEnd,pStart);doPan(pDelta.x,pDelta.y);pStart.copy(pEnd);scope.update();}
      }
      function onUp(){state=STATE.NONE;document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
      el.addEventListener('mousedown',function(e){
        if(e.button===0){state=STATE.ROTATE;rStart.set(e.clientX,e.clientY);}
        else if(e.button===2){state=STATE.PAN;pStart.set(e.clientX,e.clientY);}
        document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
      });
      el.addEventListener('wheel',function(e){scale*=(e.deltaY>0)?1.1:0.9;scope.update();e.preventDefault();},{passive:false});
      el.addEventListener('contextmenu',function(e){e.preventDefault();});
      scope.update();
    };
</script>

<script>
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x2a2a3e, 0.008);

    var camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(0, 12, 42);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.minDistance = 5; controls.maxDistance = 120;
    controls.update();

    // TEXTURE HELPER
    function makeTex(fn, size) {
      var c = document.createElement('canvas');
      c.width = c.height = size || 256;
      fn(c.getContext('2d'), c.width);
      var tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    // TEXTURES 
    var sandTex = makeTex(function(ctx,s){
      ctx.fillStyle='#7a6a52'; ctx.fillRect(0,0,s,s);
      for(var i=0;i<600;i++){
        ctx.fillStyle='rgba('+((100+Math.random()*40)|0)+','+((90+Math.random()*30)|0)+','+((70+Math.random()*20)|0)+',0.5)';
        ctx.fillRect(Math.random()*s,Math.random()*s,Math.random()*4+1,Math.random()*2+1);
      }
    });
    sandTex.wrapS=sandTex.wrapT=THREE.RepeatWrapping; sandTex.repeat.set(12,12);

    var rockTex = makeTex(function(ctx,s){
      ctx.fillStyle='#3a3530'; ctx.fillRect(0,0,s,s);
      for(var i=0;i<200;i++){
        ctx.fillStyle='rgba('+((20+Math.random()*40)|0)+','+((18+Math.random()*30)|0)+','+((15+Math.random()*25)|0)+',0.7)';
        ctx.fillRect(Math.random()*s,Math.random()*s,Math.random()*8+2,Math.random()*6+2);
      }
      ctx.strokeStyle='rgba(20,18,15,0.5)'; ctx.lineWidth=1.5;
      for(var j=0;j<10;j++){ctx.beginPath();ctx.moveTo(Math.random()*s,Math.random()*s);ctx.lineTo(Math.random()*s,Math.random()*s);ctx.stroke();}
    });

    // Water texture 
    var waterTex = makeTex(function(ctx,s){
      var g = ctx.createLinearGradient(0,0,0,s);
      g.addColorStop(0,'#1a3a50');
      g.addColorStop(0.5,'#1e4560');
      g.addColorStop(1,'#162e42');
      ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
      for(var i=0;i<40;i++){
        var alpha=0.06+Math.random()*0.12;
        ctx.strokeStyle='rgba(120,200,230,'+alpha+')';
        ctx.lineWidth=0.5+Math.random()*1.5;
        ctx.beginPath();
        var y=Math.random()*s;
        ctx.moveTo(0,y);
        ctx.bezierCurveTo(s/4,y+(Math.random()-0.5)*12,3*s/4,y+(Math.random()-0.5)*12,s,y+(Math.random()-0.5)*6);
        ctx.stroke();
      }
    },512);
    waterTex.wrapS=waterTex.wrapT=THREE.RepeatWrapping; waterTex.repeat.set(5,5);

    // White brick texture for houses
    var brickTex = makeTex(function(ctx,s){
      ctx.fillStyle='#dddbd6'; ctx.fillRect(0,0,s,s);
      var bw=s/5, bh=s/12, gap=4;
      var cols=['#e8e4de','#dedad4','#e2dfd9','#cccac4','#d8d5cf'];
      for(var row=0;row<14;row++){
        var offset=(row%2===0)?0:bw/2;
        for(var col=-1;col<7;col++){
          ctx.fillStyle=cols[Math.floor(Math.random()*cols.length)];
          var bx=col*bw+offset+gap/2;
          var by=row*bh+gap/2;
          ctx.fillRect(bx,by,bw-gap,bh-gap);
          ctx.fillStyle='rgba(180,178,172,0.3)';
          for(var g2=0;g2<6;g2++){
            ctx.fillRect(bx+Math.random()*(bw-gap),by+Math.random()*(bh-gap),Math.random()*8+2,1);
          }
        }
      }
    },512);
    brickTex.wrapS=brickTex.wrapT=THREE.RepeatWrapping; brickTex.repeat.set(3,3);

    var cliffTex = makeTex(function(ctx,s){
      var g=ctx.createLinearGradient(0,0,0,s);
      g.addColorStop(0,'#4a3d30'); g.addColorStop(0.5,'#3d3028'); g.addColorStop(1,'#2d2420');
      ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
      ctx.strokeStyle='rgba(20,15,10,0.4)'; ctx.lineWidth=2;
      for(var i=0;i<14;i++){ctx.beginPath();ctx.moveTo(0,i*s/14+(Math.random()-0.5)*10);ctx.lineTo(s,i*s/14+(Math.random()-0.5)*10);ctx.stroke();}
    });

    // Night sky texture
    var nightSkyTex = makeTex(function(ctx,s){
      var g=ctx.createLinearGradient(0,0,0,s);
      g.addColorStop(0,'#050510'); g.addColorStop(0.4,'#0d0d20'); g.addColorStop(0.8,'#181828'); g.addColorStop(1,'#252035');
      ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
      // star
      for(var i=0;i<280;i++){
        var a=0.4+Math.random()*0.9;
        ctx.fillStyle='rgba(220,225,255,'+a+')';
        var sr=Math.random()*1.5+0.3;
        ctx.beginPath(); ctx.arc(Math.random()*s,Math.random()*s*0.75,sr,0,Math.PI*2); ctx.fill();
      }
      // cloud 
      ctx.fillStyle='rgba(30,28,48,0.55)';
      for(var i=0;i<16;i++){ctx.beginPath();ctx.ellipse(Math.random()*s,Math.random()*s*0.6,Math.random()*130+40,Math.random()*40+14,Math.random()*0.5,0,Math.PI*2);ctx.fill();}
    },1024);

    var daySkyTex = makeTex(function(ctx,s){
      var g=ctx.createLinearGradient(0,0,0,s);
      g.addColorStop(0,'#1a6ab5'); g.addColorStop(0.5,'#4a9fd4'); g.addColorStop(0.85,'#82c4e8'); g.addColorStop(1,'#b8dff0');
      ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
      ctx.fillStyle='rgba(255,255,255,0.85)';
      var clouds=[[0.15,0.25],[0.45,0.18],[0.7,0.3],[0.25,0.4],[0.85,0.22]];
      clouds.forEach(function(c){
        var cx2=c[0]*s, cy2=c[1]*s;
        [[-40,0,70,28],[0,-18,55,22],[40,0,65,25],[0,12,80,22]].forEach(function(b){
          ctx.beginPath(); ctx.ellipse(cx2+b[0],cy2+b[1],b[2],b[3],0,0,Math.PI*2); ctx.fill();
        });
      });
    },1024);

    var sealTex = makeTex(function(ctx,s){
      ctx.fillStyle='#888890'; ctx.fillRect(0,0,s,s);
      ctx.fillStyle='rgba(60,60,70,0.35)';
      for(var i=0;i<60;i++){ctx.beginPath();ctx.ellipse(Math.random()*s,Math.random()*s,Math.random()*8+2,Math.random()*5+2,Math.random()*Math.PI,0,Math.PI*2);ctx.fill();}
    });

    // SKYBOX
    function makeNightFaces() {
      function nightSide() { return makeTex(function(ctx,s){
        var g=ctx.createLinearGradient(0,0,0,s);g.addColorStop(0,'#050510');g.addColorStop(0.5,'#0d0d20');g.addColorStop(1,'#181828');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
        ctx.fillStyle='rgba(20,18,40,0.4)';for(var i=0;i<8;i++){ctx.beginPath();ctx.ellipse(Math.random()*s,s*0.3+Math.random()*s*0.3,Math.random()*100+30,Math.random()*30+10,Math.random()*0.5,0,Math.PI*2);ctx.fill();}
        for(var i=0;i<300;i++){var a=0.6+Math.random()*0.9;ctx.fillStyle='rgba(220,225,255,'+a+')';ctx.beginPath();ctx.arc(Math.random()*s,Math.random()*s,Math.random()*1.6+0.4,0,Math.PI*2);ctx.fill();}
      },1024); }
      var top = makeTex(function(ctx,s){
        ctx.fillStyle='#020208';ctx.fillRect(0,0,s,s);
        for(var i=0;i<500;i++){var a=0.5+Math.random()*0.9;ctx.fillStyle='rgba(220,225,255,'+a+')';ctx.beginPath();ctx.arc(Math.random()*s,Math.random()*s,Math.random()*1.8+0.3,0,Math.PI*2);ctx.fill();}
      },512);
      var bottom = makeTex(function(ctx,s){ctx.fillStyle='#0a0c10';ctx.fillRect(0,0,s,s);},512);
      return [nightSide(),nightSide(),top,bottom,nightSide(),nightSide()];
    }
    function makeDayFaces() {
      function daySide() { return makeTex(function(ctx,s){
        var g=ctx.createLinearGradient(0,0,0,s);g.addColorStop(0,'#1a6ab5');g.addColorStop(0.5,'#4a9fd4');g.addColorStop(0.85,'#82c4e8');g.addColorStop(1,'#b8dff0');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
        ctx.fillStyle='rgba(255,255,255,0.88)';var clouds=[[0.15,0.3],[0.55,0.2],[0.8,0.35]];clouds.forEach(function(c){var cx2=c[0]*s,cy2=c[1]*s;[[-35,0,65,26],[0,-16,50,20],[35,0,60,23],[0,10,75,20]].forEach(function(b){ctx.beginPath();ctx.ellipse(cx2+b[0],cy2+b[1],b[2],b[3],0,0,Math.PI*2);ctx.fill();});});
      },1024); }
      var top = makeTex(function(ctx,s){ctx.fillStyle='#1060b0';ctx.fillRect(0,0,s,s);},512);
      var bottom = makeTex(function(ctx,s){ctx.fillStyle='#3a3020';ctx.fillRect(0,0,s,s);},512);
      return [daySide(),daySide(),top,bottom,daySide(),daySide()];
    }
    var skyboxMats = makeNightFaces().map(function(t){return new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false});});
    var skyboxMesh = new THREE.Mesh(new THREE.BoxGeometry(1200,1200,1200), skyboxMats);
    skyboxMesh.renderOrder = -1;
    scene.add(skyboxMesh);

    // Ambient 
    var ambientLight = new THREE.AmbientLight(0x8899cc, 1.0);
    scene.add(ambientLight);

    //Directional
    var moonLight = new THREE.DirectionalLight(0xaaccff, 2.5);
    moonLight.position.set(60, 80, -120); // same position as moon sphere
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 4096;
    moonLight.shadow.mapSize.height = 4096;
    moonLight.shadow.camera.left = -100;
    moonLight.shadow.camera.right = 100;
    moonLight.shadow.camera.top = 100;
    moonLight.shadow.camera.bottom = -100;
    moonLight.shadow.camera.far = 400;
    moonLight.shadow.bias = -0.0005;
    scene.add(moonLight);

    //  Hemisphere
    var hemLight = new THREE.HemisphereLight(0x7090c0, 0x404030, 0.8);
    scene.add(hemLight);

    //  Point 
    var glowLight = new THREE.PointLight(0x30d0c0, 2.0, 30);
    glowLight.position.set(0, 1, 0);
    scene.add(glowLight);

    // Spot
    var fillSpot = new THREE.SpotLight(0xaabbdd, 0.6, 100, Math.PI/10, 0.5);
    fillSpot.position.set(-40, 55, 10);
    fillSpot.target.position.set(0, 0, 0);
    fillSpot.castShadow = false;
    scene.add(fillSpot);
    scene.add(fillSpot.target);

    //  MATERIALS 
    var mRock    = new THREE.MeshLambertMaterial({map:rockTex});
    var mSand    = new THREE.MeshLambertMaterial({map:sandTex});
    var mWater   = new THREE.MeshPhongMaterial({map:waterTex,transparent:true,opacity:0.88,shininess:120,specular:new THREE.Color(0x88ccee)});
    var mCliff   = new THREE.MeshLambertMaterial({map:cliffTex});
    var mSeal    = new THREE.MeshLambertMaterial({map:sealTex});
    var mWetRock = new THREE.MeshPhongMaterial({color:0x2a2830,shininess:90,specular:new THREE.Color(0x223344)});
    var mMoss    = new THREE.MeshLambertMaterial({color:0x3d4a2a});
    var mMtn     = new THREE.MeshLambertMaterial({color:0x28223a});
    var mFoamLine= new THREE.MeshPhongMaterial({color:0xddeeff,transparent:true,opacity:0.35,shininess:60});

    function sh(mesh){mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}

    //GROUND 
    var shore = new THREE.Mesh(new THREE.PlaneGeometry(120,50),mSand);
    shore.rotation.x=-Math.PI/2;
    shore.position.set(0,0,12);
    shore.receiveShadow=true;
    scene.add(shore);

    //  OCEAN FLOOR
    var seaFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(120,55),
      new THREE.MeshLambertMaterial({color:0x0d1e28})
    );
    seaFloor.rotation.x=-Math.PI/2;
    seaFloor.position.set(0,-0.5,-38);
    seaFloor.receiveShadow=true;
    scene.add(seaFloor);

    //  WATER SURFACE
    var waterGeo = new THREE.PlaneGeometry(120,45,60,40);
    var waterMesh = new THREE.Mesh(waterGeo,mWater);
    waterMesh.rotation.x=-Math.PI/2;
    waterMesh.position.set(0,0.4,-38);
    waterMesh.receiveShadow=true;
    scene.add(waterMesh);
    var waterBase = new Float32Array(waterGeo.attributes.position.array);

    // Shore edge
    var wetSand = new THREE.Mesh(
      new THREE.PlaneGeometry(120,4),
      new THREE.MeshPhongMaterial({color:0x4a5040,transparent:true,opacity:0.5,shininess:40})
    );
    wetSand.rotation.x=-Math.PI/2;
    wetSand.position.set(0,0.05,-14);
    wetSand.receiveShadow=true;
    scene.add(wetSand);

    // animated wave crests 
    var waveCrests = [];
    for(var i=0;i<4;i++){
      var wc = new THREE.Mesh(
        new THREE.PlaneGeometry(80,0.8),
        mFoamLine
      );
      wc.rotation.x=-Math.PI/2;
      wc.position.set(-10+Math.random()*20, 0.45, -2+i*4.5);
      wc.receiveShadow=true;
      scene.add(wc);
      waveCrests.push({mesh:wc,baseZ:wc.position.z,offset:i*1.4});
    }

    // ROCKS
    var rg=[new THREE.DodecahedronGeometry(1,0),new THREE.IcosahedronGeometry(1,0)];
    function addRock(x,y,z,rx,ry,rz,sx,sy,sz){
      var rock=new THREE.Mesh(rg[Math.random()>0.5?0:1],Math.random()>0.5?mRock:mWetRock);
      rock.scale.set(sx,sy,sz); rock.position.set(x,y,z); rock.rotation.set(rx,ry,rz);
      sh(rock); scene.add(rock);
    }
    addRock( 4,2.5, 4, 0.3,0.5,0.1, 4,3.5,3.5);
    addRock(-6,1.8, 6, 0.1,1.2,0.2, 3,2.5,2.8);
    addRock(12,1.5, 2, 0.5,0.3,0.4, 2.5,2,2.2);
    addRock(-14,2.2,-2, 0.2,0.8,0.1, 3.5,3,3);
    addRock( 8,1.2,-5, 0.4,1.5,0.3, 2,1.8,2.5);
    addRock(-3,0.8, 2, 0.1,0.3,0.2, 1.5,1.2,1.8);
    addRock(18,1.0, 0, 0.3,0.7,0.1, 2,1.5,2);
    addRock(-18,1.5,-3, 0.5,1.0,0.3, 3,2,2.5);
    addRock( 2,1.0,-10, 0.2,0.4,0.1, 2,1.5,2);
    addRock(-10,0.8,-12, 0.1,1.1,0.2, 1.8,1.2,2);
    addRock(14,0.7,-14, 0.4,0.6,0.3, 1.5,1,1.8);
    addRock(-5,0.6,-18, 0.3,0.9,0.1, 1.2,0.9,1.5);

    //  MOON 
    var moonGeo = new THREE.SphereGeometry(9, 32, 32);
    var moonMat = new THREE.MeshBasicMaterial({ color: 0xeef4ff });
    var moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.position.set(60, 80, -120);
    scene.add(moonMesh);


    [14, 22, 36, 55].forEach(function(r, i) {
      var cols  = [0xc0d8ff, 0x88bbee, 0x5588bb, 0x224466];
      var opacs = [0.55,     0.30,     0.14,     0.05];
      var halo = new THREE.Mesh(
        new THREE.SphereGeometry(r, 24, 24),
        new THREE.MeshBasicMaterial({color:cols[i], transparent:true, opacity:opacs[i], side:THREE.BackSide, depthWrite:false})
      );
      halo.position.copy(moonMesh.position);
      scene.add(halo);
    });

    var moonPointLight = new THREE.PointLight(0x99ccff, 2.5, 600);
    moonPointLight.position.copy(moonMesh.position);
    scene.add(moonPointLight);

    // SUN 
    var sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(7, 32, 32),
      new THREE.MeshBasicMaterial({color: 0xffee88})
    );
    sunMesh.position.set(60, 80, -120);
    sunMesh.visible = false;
    scene.add(sunMesh);

    [14, 24, 38].forEach(function(r, i) {
      var cols  = [0xffdd44, 0xffbb22, 0xff9900];
      var opacs = [0.35, 0.18, 0.07];
      var halo = new THREE.Mesh(
        new THREE.SphereGeometry(r, 24, 24),
        new THREE.MeshBasicMaterial({color:cols[i], transparent:true, opacity:opacs[i], side:THREE.BackSide, depthWrite:false})
      );
      halo.position.copy(sunMesh.position);
      halo.visible = false;
      scene.add(halo);
      sunMesh.userData['halo'+i] = halo;
    });

    var sunPointLight = new THREE.PointLight(0xffffcc, 1.5, 600);
    sunPointLight.position.copy(sunMesh.position);
    sunPointLight.visible = false;
    scene.add(sunPointLight);

    //  DAY / NIGHT TOGGLE
    var isDay = false;

    function setDayNight(day) {
      isDay = day;
      // Sky
      var newFaces = day ? makeDayFaces() : makeNightFaces();
      skyboxMats.forEach(function(m,i){m.map=newFaces[i];m.needsUpdate=true;});
      // Sun / Moon
      moonMesh.visible = !day;

    function makeHouse(cx, cz, rotY, bodyW, bodyH, bodyD, roofH) {
      var g = new THREE.Group();
      g.position.set(cx, 0, cz);
      g.rotation.y = rotY;

      var body = new THREE.Mesh(new THREE.BoxGeometry(bodyW, bodyH, bodyD), mWall);
      body.position.y = bodyH / 2;
      sh(body); g.add(body);

      var gableW = bodyW * 0.45;
      var gableH = bodyH * 0.7;
      var gable = new THREE.Mesh(new THREE.BoxGeometry(gableW, gableH, bodyD * 0.6), mWall);
      gable.position.set(0, bodyH + gableH / 2, 0);
      sh(gable); g.add(gable);

      var peakH = roofH * 1.6;
      var peak = new THREE.Mesh(new THREE.ConeGeometry(gableW * 0.72, peakH, 4), mRoof);
      peak.position.set(0, bodyH + gableH + peakH / 2, 0);
      peak.rotation.y = Math.PI / 4;
      sh(peak); g.add(peak);

      [-1, 1].forEach(function(side) {
        var wingW = (bodyW - gableW) / 2 + 0.5;
        var wingRoof = new THREE.Mesh(new THREE.ConeGeometry(wingW * 0.9, roofH, 4), mRoof);
        wingRoof.position.set(side * (gableW / 2 + wingW / 2 - 0.2), bodyH + roofH / 2, 0);
        wingRoof.rotation.y = Math.PI / 4;
        sh(wingRoof); g.add(wingRoof);
      });

      var ch = new THREE.Mesh(new THREE.BoxGeometry(1.0, 3.5, 1.0), mChimney);
      ch.position.set(bodyW * 0.3, bodyH + gableH + 1.0, bodyD * 0.1);
      sh(ch); g.add(ch);

      var winPositions = [
        [-bodyW*0.28, bodyH*0.3,  bodyD/2+0.01],
        [ bodyW*0.28, bodyH*0.3,  bodyD/2+0.01],
        [-bodyW*0.28, bodyH*0.72, bodyD/2+0.01],
        [ bodyW*0.28, bodyH*0.72, bodyD/2+0.01],
        [0, bodyH + gableH*0.55,  bodyD*0.3+0.01]
      ];
      winPositions.forEach(function(wp, wi) {
        var ww = wi===4 ? 1.2 : 1.8;
        var wh = wi===4 ? 2.2 : 1.4;
        var win = new THREE.Mesh(new THREE.PlaneGeometry(ww, wh), mWinGlow);
        win.position.set(wp[0], wp[1], wp[2]);
        g.add(win);
        if (wi % 2 === 0) {
          var wl = new THREE.PointLight(0xffcc66, 0.6, 12);
          wl.position.set(wp[0], wp[1], wp[2] - 1.0);
          g.add(wl);
        }
      });

      scene.add(g);
      return g;
    }

    })();


    // animation
    var clock=new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      var t=clock.getElapsedTime();

      // Animate water vertices
      var pos=waterGeo.attributes.position.array;
      for(var i=0;i<pos.length;i+=3){
        pos[i+1]=Math.sin(waterBase[i]*0.25+t*1.1)*0.28+Math.sin(waterBase[i+2]*0.35+t*0.85)*0.22;
      }
      waterGeo.attributes.position.needsUpdate=true;
      waterGeo.computeVertexNormals();

      // Animate wave crests 
      waveCrests.forEach(function(wc,idx){
        var cycle=(t*0.8+wc.offset)%5.5;
        wc.mesh.position.z=wc.baseZ - cycle*0.5;
        var prog=cycle/5.5;
        wc.mesh.material.opacity=0.5*(1-Math.abs(prog*2-1));
      });

      // Seal 
      sg.position.y=0.7+Math.sin(t*1.1+1)*0.08;
      sg.rotation.z=Math.sin(t*0.8+0.5)*0.03;

      // light flicker
      var flicker=0.95+Math.sin(t*0.06)*0.04+Math.sin(t*0.11)*0.03;
      if(!isDay){ moonLight.intensity=2.5*flicker; ambientLight.intensity=1.0+flicker*0.05; }
      scene.fog.density=isDay ? 0.004 : 0.007+Math.sin(t*0.04)*0.001;

      // Bioluminescent drift
      glowLight.intensity=1.2+Math.sin(t*1.2)*0.6;
      glowLight.position.x=Math.sin(t*0.25)*6;
      glowLight.position.z=Math.cos(t*0.18)*4;

      // Lamp flicker, ripple pulse
      lampLights.forEach(function(l){
        l.light.intensity = lampDimmer + Math.sin(t*3.1+l.idx*1.7)*0.15 + Math.sin(t*7.3+l.idx*2.3)*0.08;
        if(l.ripple){
          var pulse = (t*0.6 + l.ripple.userData.rippleOffset) % 3.0;
          var scale = 0.5 + pulse * 0.5;
          l.ripple.scale.set(scale, scale, 1);
          l.ripple.material.opacity = Math.max(0, 0.15 * (1 - pulse/3.0));
        }
      });

      // Whale tail
      if(window._whaleTail){
        window._whaleTail.position.y = window._whaleTailBase + Math.sin(t*0.9+2.0)*0.3;
        window._whaleTail.rotation.z = Math.sin(t*0.7+1.0)*0.04;
      }

      controls.update();
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener('resize',function(){
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
