<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assignment 2 – Blocky Animal</title>

  <style>
    body { font-family: "Times New Roman", Times, serif; margin: 0; }
    #page { padding: 10px; }
    canvas { border: 1px solid rgb(0, 0, 0); display: block; margin: 20px 0; }
    #controls { width: 800px; }

    #clearBtn, #picBtn, #colorCycleBtn {
      margin: 10px 10px 20px 0;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #ffffff;
      font-size: 14px;
    }

    .section-title { font-size: 18px; font-weight: bold; margin: 14px 0 6px; }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .modeBtn { padding: 6px 12px; border-radius: 8px; border: 1px solid #cfcfcf; background: #fff; font-size: 13px; }
    .label { font-size: 14px; margin-right: 6px; white-space: nowrap; }
    .slider { width: 180px; }
    .slider.wide { width: 260px; }

    input[type="range"] { accent-color: #aaa; }

    #errorBox {
      display: none;
      padding: 10px;
      border: 1px solid #cc0000;
      background: #ffecec;
      color: #990000;
      margin-top: 10px;
      max-width: 820px;
      white-space: pre-wrap;
      font-family: ui-monospace, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12px;
    }
  </style>
</head>

<body onload="main()">
  <div id="page">
    <p><b>Michelle Schemkes</b><br>mschemke@ucsc.edu</p>
    <p><b>Notes to Grader:</b> bunny </p>

    <canvas id="webgl" width="400" height="400"></canvas>

    <div id="controls">

      <div id="fps" style="color:rgb(0, 0, 0)">FPS: -- </div>
      <hr>
      <button id="animOn">Animation ON</button>
      <button id="animOff">Animation OFF</button>

      <p class="section-title">Animal Controls</p>
    
      <p>Global Rotation</p>
      <input type="range" id="globalRot" min="-180" max="180" value="0" class="slider">
    
      <p>Thigh Joint</p>
      <input type="range" id="thighSlide" min="-60" max="60" value="0" class="slider">
    
      <p>Calf Joint</p>
      <input type="range" id="calfSlide" min="-90" max="90" value="0" class="slider">
    
      <p>Foot Joint</p>
      <input type="range" id="footSlide" min="-45" max="45" value="0" class="slider">
  
      <div id="errorBox"></div>
    </div>
  </div>

  
  <script src="lib/webgl-utils.js"></script>
  <script src="lib/cuon-utils.js"></script>
  <script src="lib/cuon-matrix.js"></script>

  <script src="Cube.js"></script>
  <script src="Sphere.js"></script>
  <script src="asg2.js"></script>
  


</body>
</html>
